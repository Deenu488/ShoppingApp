plugins {
    id "com.android.application"
    id "com.diffplug.spotless"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "com.example"
    compileSdk 37
	
		
    defaultConfig {
        applicationId "com.example"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "1.0.0"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }               
    }

    signingConfigs {
        release {
            storeFile rootProject.file("dnwithai_innovations.jks")            
            storePassword "dnwithai.innovations"
            keyAlias "dnwithai_innovations"
            keyPassword "dnwithai.innovations"
        }
        debug {
            storeFile rootProject.file("debug.keystore")             
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }    
    }
    
    buildTypes {
        debug {
            debuggable true
            shrinkResources false
            minifyEnabled false            
	        signingConfig signingConfigs.debug            
        }
        release {
            debuggable false
            shrinkResources true
            minifyEnabled true            
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
	        signingConfig signingConfigs.release            
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {        
        compose true 
        buildConfig false       
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    spotless {
        kotlin {
            target "**/*.kt"
            ktlint()                     
        }

        java {
            target "**/*.java"
            googleJavaFormat() 
        }
    }
}

dependencies {    
    implementation("org.jetbrains.compose.runtime:runtime:1.12.0-alpha01")
    implementation("org.jetbrains.compose.foundation:foundation:1.12.0-alpha01")
    implementation("org.jetbrains.compose.material3:material3:1.12.0-alpha01")            
    implementation("org.jetbrains.compose.ui:ui:1.12.0-alpha01")
    implementation("org.jetbrains.compose.components:components-resources:1.12.0-alpha01")  
    implementation("org.jetbrains.compose.ui:ui-tooling-preview:1.12.0-alpha01")  
    implementation("org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0-beta01")            
    implementation("org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose:2.11.0-beta01")                             
    
    implementation("androidx.activity:activity-compose:1.13.0")
  
    implementation("org.slf4j:slf4j-api:2.1.0-alpha1")
    implementation("org.slf4j:slf4j-simple:2.1.0-alpha1")
    implementation("com.googlecode.javaewah:JavaEWAH:1.2.3")
    implementation("commons-codec:commons-codec:1.22.0")
  
    implementation("com.google.code.gson:gson:2.14.0")
  
    implementation project(path: ":jgit", configuration: "shadow")
  
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
}

tasks.register('copyDependencies') {
    def classpathFiles = configurations.releaseRuntimeClasspath
    def outputDirProvider = layout.buildDirectory.dir("dependencies")

    doLast {
        def targetDir = outputDirProvider.get().asFile
        targetDir.deleteDir()
        targetDir.mkdirs()

        classpathFiles.files.each { file ->
            if (file.name.endsWith(".jar")) {
                def dest = new File(targetDir, file.name)
                java.nio.file.Files.copy(
                        file.toPath(), 
                        dest.toPath(), 
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING
                )
            } else if (file.name.endsWith(".aar")) {
                def baseName = file.name.substring(0, file.name.lastIndexOf('.'))
                def zip = new java.util.zip.ZipFile(file)
                try {
                    zip.entries().each { entry ->
                        if (entry.name == "classes.jar") {
                            def dest = new File(targetDir, "${baseName}.jar")
                            def input = zip.getInputStream(entry)
                            try {
                                java.nio.file.Files.copy(
                                        input, 
                                        dest.toPath(), 
                                        java.nio.file.StandardCopyOption.REPLACE_EXISTING
                                )
                            } finally {
                                input?.close()
                            }
                        } else if (entry.name.startsWith("libs/") && entry.name.endsWith(".jar")) {
                            def jarName = entry.name.substring(entry.name.lastIndexOf('/') + 1)
                            def dest = new File(targetDir, "${baseName}-${jarName}")
                            def input = zip.getInputStream(entry)
                            try {
                                java.nio.file.Files.copy(
                                        input, 
                                        dest.toPath(), 
                                        java.nio.file.StandardCopyOption.REPLACE_EXISTING
                                )
                            } finally {
                                input?.close()
                            }
                        }
                    }
                } finally {
                    zip.close()
                }
            }
        }
    }
}
