// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    // this is necessary to avoid the plugins to be loaded multiple times
    // in each subproject's classloader   
    id "com.android.application" version "9.4.0-alpha02" apply false
    id "com.android.library" version "9.4.0-alpha02" apply false
    id "com.diffplug.spotless" version "8.4.0" apply false
    id "org.jlleitschuh.gradle.ktlint" version "12.2.0" apply false    
    id "org.jetbrains.kotlin.plugin.compose" version "2.4.0" apply false
    id "org.jetbrains.kotlin.multiplatform" version "2.4.0" apply false
    id "org.jetbrains.compose" version "1.12.0-alpha02" apply false
    id "com.android.kotlin.multiplatform.library" version "9.4.0-alpha02" apply false
    id "org.jetbrains.kotlin.jvm" version "2.4.0" apply false
    id "com.gradleup.shadow" version "9.2.0" apply false
}