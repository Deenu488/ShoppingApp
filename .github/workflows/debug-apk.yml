name: Android CI Debug

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Safety: Kills the job if it hangs for more than 60 mins (prevents infinite "Cancelled" hangs)
    timeout-minutes: 60 

    strategy:
      # FIX: Ensure other matrix jobs keep running if one fails
      fail-fast: false
      matrix:
        java-version: ['25']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # Using the matrix variable makes it easier to add versions later
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false 

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # FIX: Added --no-daemon
        # This is the most important fix. It forces Gradle to exit after the build,
        # preventing the "Operation was cancelled" hang.
        run: ./gradlew assembleDebug --stacktrace
        
      - name: Upload Build Reports
        if: always() 
        uses: actions/upload-artifact@v5
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/*.html
            **/*.txt

      - name: Upload debug apk
        uses: actions/upload-artifact@v5
        # Only upload if the build succeeded and it's not a PR (optional check)
        if: success() && !github.head_ref
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
