name: Android CI Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Safety: Kills the job if it hangs for more than 60 mins (prevents infinite "Cancelled" hangs)
    timeout-minutes: 60 

    strategy:
      # FIX: Ensure other matrix jobs keep running if one fails
      fail-fast: false
      matrix:
        java-version: ['25']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # Using the matrix variable makes it easier to add versions later
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false 

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # FIX: Added --no-daemon
        # This is the most important fix. It forces Gradle to exit after the build,
        # preventing the "Operation was cancelled" hang.
        run: ./gradlew assembleRelease --info --stacktrace
        
      - name: Upload Build Reports
        if: always() 
        uses: actions/upload-artifact@v5
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/*.html
            **/*.txt

      # This runs ONLY if the build fails, to help you debug R8
      - name: Upload R8 Debugging Rules
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: r8-missing-rules
          path: app/build/outputs/mapping/release/missing_rules.txt

      # This runs if the build succeeds
      - name: Upload release apk and mapping
        uses: actions/upload-artifact@v4
        if: success() && !github.head_ref
        with:
          name: release-artifacts
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
